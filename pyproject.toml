[project]
name = "agentco"
version = "0.1.0"
description = "AI agent company for AdSpot Media and Sidadiya (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "google-auth>=2.34",
  "google-genai>=1.0",
  "pyotp>=2.9",
  "itsdangerous>=2.2",
  "pywebpush>=2.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agentco*"]
